name: NEXUS Docker Publish

on:
  push:
    branches:
      - feature/nexus-2-autonomous-browser
    paths:
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/nexus-docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push NEXUS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            3224jaj/nexus-ai:latest
            3224jaj/nexus-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
